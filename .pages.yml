# Admin-Bereich (Pages CMS – https://app.pagescms.org)
# Legt fest, welche Formulare es gibt und wo die Inhalte gespeichert werden.
# Nach jedem Speichern baut GitHub die Website automatisch neu (.github/workflows/website.yml).

media:
  - name: bilder
    label: Bilder
    input: assets/bilder
    output: /assets/bilder
    categories: [image]
  - name: downloads
    label: Downloads (Presse & Plakate)
    input: assets/downloads
    output: /assets/downloads
    extensions: [pdf, zip, jpg, jpeg, png, docx]

content:
  # ---------------------------------------------------------------- Termine
  - name: termine
    label: Termine
    type: file
    path: inhalte/termine.json
    format: json
    list: true
    fields:
      - name: stueck
        label: Stück
        type: reference
        required: true
        description: Aus welchem Stück stammt die Vorstellung? Bild, Alter und Stückseite werden automatisch verknüpft.
        options:
          collection: stuecke
          value: "{path}"
          label: "{fields.titel}"
          search: "fields.titel"
      - name: titel
        label: Titel der Vorstellung
        type: string
        required: true
        description: So erscheint die Vorstellung in der Terminliste und bei Google, z. B. „Das NEINhorn“ oder „Peppa feiert Weihnachten“.
      - name: beschreibung
        label: Kurzbeschreibung
        type: text
        required: true
        description: 1–2 Sätze für Terminseite, Google und Kalender-Eintrag.
      - name: ort
        label: Spielort
        type: object
        fields:
          - name: name
            label: Name des Spielorts
            type: string
            required: true
            description: z. B. „Theaterzelt auf dem Schützenplatz“
          - name: strasse
            label: Straße & Hausnummer
            type: string
          - name: plz
            label: PLZ
            type: string
          - name: stadt
            label: Stadt
            type: string
            required: true
      - name: von
        label: Erster Spieltag
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: bis
        label: Letzter Spieltag
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: zeiten
        label: Spielzeiten je Wochentag
        type: object
        description: Uhrzeit eintragen, z. B. „16:00“. Zwei Vorstellungen am selben Tag mit Komma trennen, z. B. „11:00, 14:00“. Leer lassen = an diesem Wochentag keine Vorstellung.
        fields:
          - { name: Mo, label: Montag, type: string }
          - { name: Di, label: Dienstag, type: string }
          - { name: Mi, label: Mittwoch, type: string }
          - { name: Do, label: Donnerstag, type: string }
          - { name: Fr, label: Freitag, type: string }
          - { name: Sa, label: Samstag, type: string }
          - { name: So, label: Sonntag, type: string }
      - name: ausfall
        label: Tage ohne Vorstellung
        type: date
        list: true
        description: Einzelne Tage im Zeitraum, an denen nicht gespielt wird (z. B. Feiertag).
        options:
          format: yyyy-MM-dd
      - name: zusatz
        label: Zusätzliche Vorstellungen
        type: date
        list: true
        description: Extra-Vorstellungen mit Datum und Uhrzeit, die nicht in den Wochenrhythmus passen.
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: preise
        label: Eintrittspreise
        type: object
        list:
          collapsible: true
        fields:
          - name: name
            label: Bezeichnung
            type: string
            description: z. B. „Erwachsene“, „Kinder“, „pro Person“
          - name: preis
            label: Preis in €
            type: string
            description: z. B. „12,00“
      - name: bild
        label: Eigenes Bild (optional)
        type: image
        description: Leer lassen = Titelbild des Stücks wird verwendet.
        options:
          media: bilder
      - name: vorverkauf
        label: Vorverkauf (optional)
        type: object
        description: Nur ausfüllen, wenn es für dieses Gastspiel einen Vorverkauf gibt. Leer lassen = nur Kasse vor Ort.
        fields:
          - name: text
            label: Hinweis
            type: text
            description: z. B. „Tickets im Vorverkauf bei der Tourist-Information Rerik und online.“
          - name: link
            label: Link zum Ticketshop (optional)
            type: string
            description: Vollständige Adresse, z. B. https://…
      - name: status
        label: Status
        type: select
        default: geplant
        options:
          values:
            - { name: geplant, label: Findet statt }
            - { name: ausverkauft, label: Ausverkauft }
            - { name: verschoben, label: Verschoben }
            - { name: abgesagt, label: Abgesagt }

  # ---------------------------------------------------------------- Repertoire
  - name: stuecke
    label: Repertoire (Stücke)
    type: collection
    path: inhalte/stuecke
    format: json
    filename: "{primary}.json"
    view:
      primary: titel
      fields: [titel, alter, sichtbar]
      sort: [reihenfolge, titel]
    fields:
      - name: titel
        label: Titel
        type: string
        required: true
        description: Aus dem Titel entsteht auch die Adresse der Stückseite, z. B. …/stuecke/das-neinhorn.html
      - name: sichtbar
        label: Auf der Website zeigen
        type: boolean
        default: true
      - name: reihenfolge
        label: Reihenfolge
        type: number
        description: Kleinere Zahl = weiter vorne im Repertoire.
      - name: vorlage
        label: Vorlage / Untertitel
        type: string
        description: z. B. „nach dem Bilderbuch von Marc-Uwe Kling und Astrid Henn“
      - name: tags
        label: Schlagworte
        type: string
        list: true
        description: Kleine Etiketten auf der Karte, z. B. „Neu“, „Ab 2 Jahren“. Das erste wird gelb hervorgehoben.
      - name: kurz
        label: Kurzbeschreibung
        type: text
        required: true
        description: 1–2 Sätze für die Stück-Karte und Google.
      - name: zitat
        label: Zitat (optional)
        type: object
        description: Z. B. der erste Satz aus dem Buch – steht kursiv vor der Kurzbeschreibung.
        fields:
          - { name: text, label: Zitat (ohne Anführungszeichen), type: text }
          - { name: quelle, label: Quelle, type: string, description: "z. B. „aus ‚Furzipups, der Knatterdrache‘ von Kai Lüftner“" }
      - name: alter
        label: Alter
        type: string
        description: z. B. „ab 3 Jahren“
      - name: dauer
        label: Dauer
        type: string
        description: z. B. „45 Minuten“ oder „30–45 Minuten“ – „ca.“ wird automatisch ergänzt. Die Dauer gilt auch für alle Termine dieses Stücks.
      - name: zuschauer
        label: Zuschauer
        type: string
        description: z. B. „bis 150 Zuschauer“
      - name: spielform
        label: Spielform
        type: string
        description: z. B. „Handpuppen“
      - name: bilder
        label: Bilder
        type: object
        list:
          collapsible: true
        description: Das erste Bild ist das Titelbild (Karte, Stückseite, Termine, Google).
        fields:
          - name: src
            label: Bild
            type: image
            required: true
            options:
              media: bilder
          - name: alt
            label: Bildbeschreibung (für Google & Barrierefreiheit)
            type: string
            description: Was ist zu sehen? z. B. „Das NEINhorn mit dem WasBären auf der Bühne“
          - name: text
            label: Bildunterschrift (optional)
            type: string
          - name: fokus
            label: Bildausschnitt
            type: select
            default: mitte
            description: Bei hochkanten Fotos „oben“ wählen, damit Köpfe nicht abgeschnitten werden.
            options:
              values:
                - { name: oben, label: Oben }
                - { name: mitte, label: Mitte }
                - { name: unten, label: Unten }
      - name: inhalt
        label: Inhalt (Absätze)
        type: text
        list: true
        description: Worum geht es? Jeder Eintrag ist ein Absatz.
      - name: highlights
        label: Das erwartet die Kinder
        type: string
        list: true
      - name: paedagogik
        label: Pädagogischer Wert
        type: string
        list: true
      - name: mitwirkende
        label: Mitwirkende
        type: object
        list: true
        description: Team der Inszenierung, z. B. Spiel, Text, Figuren, Bühnenbild.
        fields:
          - { name: rolle, label: Aufgabe, type: string }
          - { name: name, label: Name(n), type: string }
      - name: premiere
        label: Uraufführung / Premiere
        type: string
        description: z. B. „3. April 2024“
      - name: varianten
        label: Varianten (z. B. Weihnachtsfassung)
        type: object
        list: true
        fields:
          - { name: titel, label: Titel, type: string }
          - { name: text, label: Beschreibung, type: text }
      - name: presse
        label: Presse & Material (Downloads)
        type: object
        description: Erscheint auf der Stückseite unter „Dieses Stück buchen“. Leere Felder zeigen „folgt in Kürze“.
        fields:
          - name: pressetext
            label: Pressetext (z. B. PDF oder DOCX)
            type: file
            options:
              media: downloads
          - name: pressefotos
            label: Pressefotos (am besten als ZIP)
            type: file
            options:
              media: downloads
          - name: plakat
            label: Plakatmotiv (PDF oder JPG)
            type: file
            options:
              media: downloads
      - name: formate
        label: Spielbar als
        type: select
        options:
          multiple: true
          values: [kleine Bühne, große Bühne, im Theaterzelt]

  # ---------------------------------------------------------------- Galerie
  - name: galerie
    label: Galerie
    type: file
    path: inhalte/galerie.json
    format: json
    list: true
    # Neue Fotos oben einfügen – die ersten 5 erscheinen auch auf der Startseite. Zum Löschen den Eintrag entfernen.
    fields:
      - name: bild
        label: Foto
        description: Neue Fotos oben einfügen – die ersten 5 erscheinen auch auf der Startseite. Zum Löschen den Eintrag entfernen.
        type: image
        required: true
        options:
          media: bilder
      - name: titel
        label: Bildunterschrift
        type: string
      - name: alt
        label: Bildbeschreibung (für Google & Barrierefreiheit)
        type: string

  # ---------------------------------------------------------------- Bewertungen
  # Ausgewählte Google-Bewertungen für die Veranstalterseite (Bereich „Referenzen“).
  # Nur Einträge mit 5 Sternen und Haken bei „Anzeigen“ erscheinen. Texte bitte unverändert von Google übernehmen.
  - name: bewertungen
    label: Bewertungen
    type: file
    path: inhalte/bewertungen.json
    format: json
    list: true
    fields:
      - name: name
        label: Name (gekürzt)
        type: string
        required: true
        description: Vorname + Anfangsbuchstabe, z. B. „Paula R.“
      - name: sterne
        label: Sterne
        type: number
        default: 5
        description: Es werden nur Bewertungen mit 5 Sternen angezeigt.
      - name: datum
        label: Monat der Bewertung
        type: date
        options:
          format: yyyy-MM
      - name: text
        label: Text der Bewertung
        type: text
        required: true
        description: Originaltext von Google – bitte nicht kürzen oder verändern.
      - name: anzeigen
        label: Auf der Website anzeigen
        type: boolean
        default: true

  - name: google
    label: Google-Gesamtbewertung
    type: file
    path: inhalte/google.json
    format: json
    fields:
      - name: sterne
        label: Durchschnitt
        type: string
        description: z. B. „4,7“ – bitte gelegentlich mit Google abgleichen.
      - name: anzahl
        label: Anzahl der Bewertungen
        type: number
      - name: link
        label: Link zu den Google-Bewertungen
        type: string

  # ---------------------------------------------------------------- KULTURzelt
  - name: kulturzelt
    label: KULTURzelt (Vermietung)
    type: file
    path: inhalte/kulturzelt.json
    format: json
    fields:
      - name: zelte
        label: Zelte
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - { name: name, label: Name des Zelts, type: string, required: true }
          - name: bilder
            label: Fotos
            description: Mehrere Fotos lassen sich auf der Website durchwischen. Das erste ist das Titelfoto.
            type: image
            list: true
            options:
              media: bilder
          - { name: groesse, label: Größe, type: string, description: "z. B. „12 × 18 m“" }
          - { name: plaetze, label: Plätze, type: string, description: "z. B. „bis 300 Sitzplätze“" }
          - { name: flaeche, label: Benötigte Stellfläche, type: string }
          - { name: beschreibung, label: Beschreibung, type: text }
          - { name: ausstattung, label: Ausstattung, type: string, list: true }
      - name: equipment
        label: Weiteres Equipment
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - { name: name, label: Bezeichnung, type: string, required: true }
          - { name: text, label: Beschreibung, type: text }
